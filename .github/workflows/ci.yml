name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  server:
    name: Server (Linux build, tests, Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libsodium-dev libssl-dev

      - name: Generated protocol files are up to date
        run: python3 tools/gen_protocol.py --check

      - name: Validate content (models, zones and reachability, mob levels against zone bands, quests, loot, vendors, factions)
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_content.py --self-test

      - name: Generated models, classes, items and the client content copy are up to date
        run: |
          python3 tools/gen_models.py --check
          python3 tools/sync_client_content.py --check
          python3 tools/gen_classes.py --check
          python3 tools/gen_items.py --check
          python3 tools/gen_mobs.py --check
          python3 tools/world_props.py --check
          python3 tools/gen_world.py --check
          python3 tools/gen_quests.py --check
          python3 tools/gen_sounds.py --check

      - name: Build (release, warnings are errors)
        run: cmake --preset release && cmake --build --preset release

      - name: Unit tests (release)
        run: ctest --preset release

      - name: Balance simulator report (every class solo, levels 1-60)
        run: ./build/release/tools/balance_sim/emberfall-balance-sim --fights 8

      - name: Progression simulator (time to level 1-60 per class, solo and grouped; fails on outliers)
        run: ./build/release/tools/balance_sim/emberfall-balance-sim --progression --step 3 --fights 4 --factor 1.4 --strict

      - name: Build (ASan + UBSan)
        run: cmake --preset asan && cmake --build --preset asan

      - name: Unit tests (ASan + UBSan)
        run: ctest --preset asan

      - name: Live server test with bots, version mismatch, and fuzzing (ASan + UBSan)
        run: bash tools/scripts/live_test.sh build/asan

      - name: End-to-end smoke test (login, create, level, loot, trade, logout; ASan + UBSan)
        run: SMOKE_SKIP_BUILD=1 bash tools/scripts/smoke_test.sh asan

      - name: Load test (100 bots in four zones for 60 s; fails if the p99 tick exceeds 25 ms)
        run: bash tools/scripts/load_test.sh build/release 100 60

      - name: Coverage-guided fuzzing (decoder and a live session, 2 minutes each; Clang, ASan + UBSan)
        run: |
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          cmake --preset fuzz && cmake --build --preset fuzz
          mkdir -p fuzz/protocol fuzz/server
          build/fuzz/tools/fuzz/emberfall-fuzz-protocol fuzz/protocol -max_total_time=120 -max_len=2048
          build/fuzz/tools/fuzz/emberfall-fuzz-server fuzz/server -max_total_time=120 -max_len=4096 -rss_limit_mb=4096

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/scripts/install_godot.sh ~/godot "$GODOT_VERSION"

      - name: End-to-end test with two headless Godot clients
        run: |
          ~/godot/godot --headless --path client --import
          bash tools/scripts/client_e2e.sh ~/godot/godot build/release

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t emberfall-server:ci .

  client:
    name: Client (Windows export)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generated protocol files are up to date
        run: python3 tools/gen_protocol.py --check

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/scripts/install_godot.sh ~/godot "$GODOT_VERSION"

      - name: Generated models, classes, items and the client content copy are up to date
        run: |
          python3 tools/gen_models.py --check
          python3 tools/sync_client_content.py --check

      - name: Import project
        run: ~/godot/godot --headless --path client --import

      - name: Zone scene exports are up to date (Godot scenes -> server collision, markers, zone lines)
        run: ~/godot/godot --headless --path client --script res://tools/export_zones.gd -- --check

      - name: Client tests (models, animation, UI, world geometry and dungeon generator parity)
        run: ~/godot/godot --headless --path client --script res://tests/test_runner.gd

      - name: Export Windows client
        run: |
          mkdir -p client/build
          ~/godot/godot --headless --path client --export-release "Windows Desktop" build/EmberfallClient.exe
          test -s client/build/EmberfallClient.exe

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: EmberfallClient-windows-x86_64
          path: client/build/EmberfallClient.exe
          if-no-files-found: error
